baseURL = "https://www.yenchungchen.com/"
title = "Yen-Chung Chen"
copyright = "&copy; Yen-Chung Chen 2015 - {year}"

defaultContentLanguage = "en"
removePathAccents = true
summaryLength = 30
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[permalinks]
  posts = "/posts/:slug/"
  projects = "/projects/:slug/"
  talks = "/talks/:slug/"
  courses = "/courses/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  resampleFilter = "lanczos"
  quality = 90
  anchor = "smart"

[params]
  description = "Developmental biology, neurobiology, and bioinformatics."
  date_format = "2006-01-02"
  avatar = "img/avatar.jpg"

  [params.fonts]
    body = "\"Literata\", Georgia, Cambria, \"Times New Roman\", serif"
    google_stylesheets = [
      "https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..800;1,7..72,400..700&display=swap"
    ]

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

