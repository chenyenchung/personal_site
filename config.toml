baseURL = "https://www.yenchungchen.com/"
title = "Yen-Chung Chen"
copyright = "&copy; Yen-Chung Chen 2015 - {year}"

defaultContentLanguage = "en"
hasCJKLanguage = true
removePathAccents = true
summaryLength = 30
enableEmoji = true
enableRobotsTXT = true
footnoteReturnLinkContents = "<sup>^</sup>"
ignoreFiles = ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"
  publications = "/publications/:slug/"
  projects = "/projects/:slug/"
  talks = "/talks/:slug/"
  courses = "/courses/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  resampleFilter = "lanczos"
  quality = 90
  anchor = "smart"

[params]
  description = "Developmental biology, neurobiology, and bioinformatics."
  author = "Yen-Chung Chen"
  email = "ycc520@nyu.edu"
  date_format = "2006-01-02"
  avatar = "img/avatar.jpg"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 20

[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 30

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 40

[[menu.main]]
  name = "Awards"
  url = "/awards/"
  weight = 50

[[menu.main]]
  name = "Talks"
  url = "/talks/"
  weight = 60

[[menu.main]]
  name = "Courses"
  url = "/courses/"
  weight = 70

[[menu.main]]
  name = "CV"
  url = "/cv/current_cv.pdf"
  weight = 90
