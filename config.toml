  [params.macademia.theme]
    custom_css = []

  [params.macademia.labels]
    slides = "Slides"

  [[params.macademia.footer.links]]
    name = "Privacy"
    url = "/privacy/"

  [[params.macademia.footer.links]]
    name = "Terms"
    url = "/terms/"

  [params.macademia.sections.posts]
    class = "post"
    name = "Posts"

  [params.macademia.sections.talks]
    class = "post"
    name = "Talks"

  [params.macademia.sections.projects]
    class = "supertag"
    name = "Projects"
    field = "projects"
    include_sections = ["posts", "talks", "publications"]

  [params.macademia.sections.publications]
    class = "publications"
    name = "Publications"

  [params.macademia.sections.about]
    class = "page"
    name = "About"

  [params.macademia.sections.awards]
    class = "page"
    name = "Awards"

