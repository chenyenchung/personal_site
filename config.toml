baseURL = "https://www.yenchungchen.com/"
title = "Yen-Chung Chen"
copyright = "&copy; Yen-Chung Chen 2015 - {year}"
theme = "macademia"

defaultContentLanguage = "en"
removePathAccents = true
summaryLength = 30
enableRobotsTXT = true

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/posts/:slug/"
  projects = "/projects/:slug/"
  publications = "/publications/:slug/"
  talks = "/talks/:slug/"
  courses = "/courses/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  resampleFilter = "lanczos"
  quality = 90
  anchor = "smart"

[params]
  description = "Developmental biology, neurobiology, and bioinformatics."
  date_format = "2006-01-02"
  avatar = "img/avatar.jpg"

  [params.fonts]
    body = "\"EB Garamond\", Georgia, Cambria, \"Times New Roman\", serif"
    google_stylesheets = [
      "https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    ]

  [params.macademia]
    selfAuthor = ["Yen-Chung Chen", "Y-C. Chen"]

  [params.macademia.home]
    eyebrow = "Developmental neurobiology / Gene Regulation / Machine Learning"
    avatar_alt = "Portrait of Yen-Chung Chen"
    summary_section = "about"
    publications_section = "publications"
    publications_title = "Featured Publications"
    publications_link_label = "All publications"
    publications_count = 5
    supertag_section = "projects"
    supertag_title = "Projects"
    supertag_link_label = "All projects"
    posts_section = "posts"
    posts_title = "Recent Posts"
    posts_link_label = "All posts"
    posts_count = 4

  [params.macademia.navigation]
    hide_empty_sections = true

  [params.macademia.search]
    enabled = true
    sections = ["about", "posts", "projects", "awards", "talks", "courses", "publications"]
    placeholder = "Search posts, publications, projects"

  [params.macademia.profile]
    show_on_sections = ["about"]

  [[params.macademia.profile.links]]
    key = "email"
    icon = "mail"
    name = "Email"
    handle = "ycc520@nyu.edu"
    url = "mailto:ycc520@nyu.edu"
    enabled = true

  [[params.macademia.profile.links]]
    key = "google_scholar"
    icon = "scholar"
    name = "Google Scholar"
    handle = "JtsGxWEAAAAJ"
    url = "https://scholar.google.com/citations?user=JtsGxWEAAAAJ"
    enabled = true

  [[params.macademia.profile.links]]
    key = "github"
    icon = "github"
    name = "GitHub"
    handle = "chenyenchung"
    url = "https://github.com/chenyenchung"
    enabled = true

  [[params.macademia.profile.links]]
    key = "bluesky"
    icon = "bluesky"
    name = "Bluesky"
    handle = "ycchentw.bsky.social"
    url = "https://bsky.app/profile/ycchentw.bsky.social"
    enabled = true

  [[params.macademia.profile.links]]
    key = "twitter"
    icon = "twitter"
    name = "Twitter"
