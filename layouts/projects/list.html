{{ define "main" }}
  <section class="page-shell">
    <header class="page-heading">
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    </header>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    <div class="project-grid">
      {{ range .Pages.ByTitle }}
        {{ partial "page-card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}
