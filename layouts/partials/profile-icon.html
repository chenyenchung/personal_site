{{ $icon := . }}
{{ if eq $icon "mail" }}
  <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
    <path d="m3 7 9 6 9-6"></path>
  </svg>
{{ else if eq $icon "scholar" }}
  <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m2.6 10 8.6-3.9a2 2 0 0 1 1.6 0l8.6 3.9-8.6 3.9a2 2 0 0 1-1.6 0z"></path>
    <path d="M6 12.6V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.4"></path>
    <path d="M22 10v5"></path>
  </svg>
{{ else if eq $icon "github" }}
  <svg class="profile-icon profile-icon-fill" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"></path>
  </svg>
{{ else if eq $icon "twitter" }}
  <svg class="profile-icon profile-icon-fill" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M23.4 4.8c-.8.4-1.7.6-2.7.7 1-.6 1.7-1.5 2-2.6-.9.5-1.9.9-3 1.1a4.7 4.7 0 0 0-8 4.3A13.2 13.2 0 0 1 2.1 3.4a4.7 4.7 0 0 0 1.5 6.3c-.8 0-1.5-.2-2.1-.6v.1c0 2.3 1.6 4.2 3.8 4.6-.4.1-.8.2-1.2.2-.3 0-.6 0-.9-.1.6 1.9 2.3 3.2 4.4 3.3A9.4 9.4 0 0 1 .6 19.1 13.2 13.2 0 0 0 7.8 21c8.6 0 13.3-7.1 13.3-13.3v-.6c.9-.7 1.7-1.5 2.3-2.3"></path>
  </svg>
{{ else if eq $icon "mastodon" }}
  <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="4" y="3.5" width="16" height="17" rx="4"></rect>
    <path d="M8 16V9.5a2 2 0 0 1 3.6-1.2L12 9l.4-.7A2 2 0 0 1 16 9.5V16"></path>
    <path d="M12 9v5"></path>
  </svg>
{{ else if eq $icon "orcid" }}
  <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M8.5 9v6"></path>
    <path d="M8.5 6.8h.01"></path>
    <path d="M12 9v6h2a3 3 0 0 0 0-6z"></path>
  </svg>
{{ else if eq $icon "bluesky" }}
  <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 11c-1.9-3.1-4.5-5.4-6.5-5.4-1.5 0-2.5 1.2-2.5 2.8 0 2.5 2.4 5.2 6.1 6.6-2.1.3-3.6 1.4-3.6 3 0 1.3 1.1 2.4 2.6 2.4 1.7 0 3.1-1.2 3.9-3 .8 1.8 2.2 3 3.9 3 1.5 0 2.6-1.1 2.6-2.4 0-1.6-1.5-2.7-3.6-3 3.7-1.4 6.1-4.1 6.1-6.6 0-1.6-1-2.8-2.5-2.8-2 0-4.6 2.3-6.5 5.4z"></path>
  </svg>
{{ else }}
  <span class="profile-icon profile-icon-fallback" aria-hidden="true">{{ slicestr $icon 0 1 | upper }}</span>
{{ end }}
