{{ $size := .size | default 32 }}
{{ $glyphSize := mul $size 0.62 }}
<span class="hanko" style="width: {{ $size }}px; height: {{ $size }}px;" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="{{ $glyphSize }}" height="{{ $glyphSize }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <line x1="4" y1="10" x2="20" y2="10" />
    <line x1="14" y1="4" x2="14" y2="20" />
    <line x1="5" y1="17" x2="9" y2="17" stroke-width="1.5" opacity="0.6" />
  </svg>
</span>
